<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .wrapper {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 18px 20px;
    background: #1c1c1c;
    border-radius: 16px;
    text-decoration: none;
    color: #ffffff;
    transition: background 0.15s;
  }

  .link-card:hover { background: #242424; }
  .link-card:active { background: #2a2a2a; }

  /* Banner */
  .banner {
    width: 100%;
    max-width: 480px;
    background: rgba(173,255,0,0.08);
    border: 1px solid rgba(173,255,0,0.2);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .banner strong { color: rgba(255,255,255,0.8); }
  .banner span { margin-right: 4px; }

    .link-card.disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  .icon-box {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    background: #ADFF00;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-box svg {
    width: 32px;
    height: 32px;
    fill: #111111;
  }

  .link-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .link-nome {
    font-size: 19px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.3px;
    line-height: 1.2;
  }

  .link-sub {
    font-size: 15px;
    font-weight: 400;
    color: rgba(255,255,255,0.45);
    line-height: 1.3;
  }

  .seta {
    color: rgba(255,255,255,0.25);
    font-size: 20px;
    font-weight: 300;
    flex-shrink: 0;
  }

  .link-card:hover .seta { color: rgba(255,255,255,0.5); }
</style>
<script>
  // Force open links in external browser (bypass Instagram/TikTok in-app browser)
  function openExternal(url) {
    // Try multiple methods to force external browser
    window.open(url, '_system');
    setTimeout(function() {
      window.location.href = url;
    }, 100);
  }

  document.addEventListener('DOMContentLoaded', function() {
    var links = document.querySelectorAll('a.link-card');
    links.forEach(function(link) {
      var url = link.getAttribute('href');
      if (url && url !== '#') {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          openExternal(url);
        });
      }
    });
  });
</script>
</head>
<body>

<div class="banner">
