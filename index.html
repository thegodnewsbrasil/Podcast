<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .wrapper {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 18px 20px;
    background: #1c1c1c;
    border-radius: 16px;
    text-decoration: none;
    color: #ffffff;
    transition: background 0.15s;
  }

  .link-card:hover { background: #242424; }
  .link-card:active { background: #2a2a2a; }

  .link-card.disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  .icon-box {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    background: #ADFF00;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-box svg {
    width: 32px;
    height: 32px;
    fill: #111111;
  }

  .link-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .link-nome {
    font-size: 19px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.3px;
    line-height: 1.2;
  }

  .link-sub {
    font-size: 15px;
    font-weight: 400;
    color: rgba(255,255,255,0.45);
    line-height: 1.3;
  }

  .seta {
    color: rgba(255,255,255,0.25);
    font-size: 20px;
    font-weight: 300;
    flex-shrink: 0;
  }

  .link-card:hover .seta { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>

<div class="wrapper">

  <!-- YouTube -->
  <a href="https://youtube.com/@thegoodnews_cast" target="_blank" class="link-card">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

      </svg>
    </div>
    <div class="link-info">
      <div class="link-nome">YouTube</div>
      <div class="link-sub">Assista os vídeos</div>
    </div>
    <div class="seta">›</div>
  </a>

</body>
</html>
